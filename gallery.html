<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery｜secret yellow</title>

    <meta
        name="description"
        content="ひなきが制作したオリジナルイラストの一覧ページです。"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header gallery-page-header">

        <div class="header-inner">

            <a href="index.html" class="logo">
                <span class="logo-main">secret yellow</span>
            </a>

            <button
                class="menu-button"
                type="button"
                aria-label="メニューを開く"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="gallery.html">GALLERY</a></li>
                    <li><a href="index.html#works">WORKS</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="index.html#contact">CONTACT</a></li>
                </ul>
            </nav>

        </div>

    </header>

    <main>

        <!-- ページタイトル -->
        <section class="gallery-page-title">

            <div class="container">

                <p class="section-en">GALLERY</p>

                <h1>Illustrations</h1>

                <p>
                    オリジナルキャラクターや物語を描いた、<br>
                    イラスト作品を掲載しています。
                </p>

            </div>

        </section>

       <div class="gallery-grid js-gallery-list"></div>


                <div class="gallery-back">
                    <a href="index.html" class="line-button">
                        BACK TO HOME
                        <span>→</span>
                    </a>
                </div>

            </div>

        </section>

    </main>

    <!-- フッター -->
    <footer class="footer">

        <div class="container footer-inner">

            <a href="index.html" class="footer-logo">
                secret yellow
            </a>

            <p>
                © 2026 HINAKI. ALL RIGHTS RESERVED.
            </p>

        </div>

    </footer>

    <!-- Lightbox -->
    <div class="lightbox">

        <button
            class="lightbox-close"
            type="button"
            aria-label="画像を閉じる"
        >
            &times;
        </button>

        <img
            class="lightbox-image"
            src=""
            alt=""
        >

    </div>

<script src="js/gallery-data.js"></script>
<script src="js/gallery.js"></script>
<script src="js/script.js"></script>

</body>

</html>
